name: reproduce

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.5"
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify exact calculations and tracked outputs
        run: python src/reproduce_pla_results.py --check
      - name: Confirm checks remain active under optimization
        run: python -O src/reproduce_pla_results.py --check
