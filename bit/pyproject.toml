[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rk-choi-margin"
version = "4.1.0"
description = "Exact symbolic and certified numerical checks for complete-positivity regions of Runge-Kutta discretizations of phase-covariant qubit Lindblad dynamics, with a candidate-aware certified guard for adaptive stepping."
requires-python = ">=3.11"
dependencies = [
  "sympy==1.14.0",
  "numpy==2.3.5",
  "scipy==1.16.1",
  "mpmath==1.3.0",
  "matplotlib==3.10.8",
]

[project.optional-dependencies]
test = ["pytest==9.0.2", "pypdf==5.9.0"]

[tool.setuptools.packages.find]
where = ["src"]
